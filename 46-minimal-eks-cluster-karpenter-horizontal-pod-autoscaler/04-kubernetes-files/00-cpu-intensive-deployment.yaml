apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-karpenter-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-karpenter-test
  template:
    metadata:
      labels:
        app: hpa-karpenter-test
    spec:
      containers:
        - name: cpu-burner
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                : $((RANDOM * RANDOM))
              done
          resources:
            requests:
              cpu: "100m"         # 0.1 vCPU per pod
              memory: "64Mi"      # 64MB per pod
            limits:
              cpu: "200m"
              memory: "128Mi"