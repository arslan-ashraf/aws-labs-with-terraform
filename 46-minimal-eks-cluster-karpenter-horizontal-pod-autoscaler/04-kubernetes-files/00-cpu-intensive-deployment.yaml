apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-karpenter-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-karpenter-test
  template:
    metadata:
      labels:
        app: hpa-karpenter-test
    spec:
      # ensures pods to run only on on-demand EC2 instances
      nodeSelector:
        karpenter.sh/capacity-type: on-demand
      # TOPOLOGY SPREAD CONSTRAINTS - deploy pods across nodes AND AZs
      topologySpreadConstraints:
        # deploy pods across instances (within same AZ)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: catalog
              app.kubernetes.io/component: service
              app.kubernetes.io/instance: catalog
        
        # deploy pods across availability zones
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: catalog
              app.kubernetes.io/component: service
              app.kubernetes.io/instance: catalog    
      containers:
        - name: cpu-burner
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                : $((RANDOM * RANDOM))
              done
          resources:
            requests:
              cpu: "100m"         # 0.1 vCPU per pod
              memory: "64Mi"      # 64MB per pod
            limits:
              cpu: "200m"
              memory: "128Mi"