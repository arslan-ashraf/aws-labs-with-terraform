apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-karpenter-test
  labels:
    app: hpa-karpenter-test
spec:
  replicas: 5
  selector:
    matchLabels:
      app: hpa-karpenter-test
  template:
    metadata:
      labels:
        app: hpa-karpenter-test
    spec:
      nodeSelector:
        # force pods to run on on-demand nodes
        karpenter.sh/capacity-type: on-demand
      terminationGracePeriodSeconds: 30   # allow graceful shutdown
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"       # 0.1 vCPU per pod
              memory: "128Mi"   # 128MB per pod
            limits:
              cpu: "200m"
              memory: "256Mi"