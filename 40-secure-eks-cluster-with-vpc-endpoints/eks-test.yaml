apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-test-nginx
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: <image_in_ECR>
        ports:
        - containerPort: 80
        
---
apiVersion: v1
kind: Service
metadata:
  name: eks-test-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
