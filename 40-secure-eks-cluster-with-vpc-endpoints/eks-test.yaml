apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-test-nginx
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: test-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: test-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eks-test-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
