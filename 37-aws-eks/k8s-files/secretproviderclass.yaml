apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: database-credentials-provider
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "database_keys"
        objectType: "secretsmanager"
        jmesPath:
          - path: "MYSQL_USERNAME"          # JSON key inside AWS Secrets Manager
            objectAlias: "MYSQL_USERNAME"   # file name in the pod
          - path: "MYSQL_PASSWORD"
            objectAlias: "MYSQL_PASSWORD"
    usePodIdentity: "true"