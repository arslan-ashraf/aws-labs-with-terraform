apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter-autoscale-on-demand-test
  labels:
    test: karpenter-on-demand
spec:
  replicas: 5
  selector:
    matchLabels:
      app: autoscale-test
  template:
    metadata:
      labels:
        app: autoscale-test
    spec:
      # force pods to on-demand nodes
      nodeSelector:
        karpenter.sh/capacity-type: spot
      containers:
        - name: pause
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.9
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"  
            limits:
              cpu: "500m"
              memory: "256Mi"